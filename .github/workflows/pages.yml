name: Build and Deploy V3.1 Permanent Growth
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: node tests/idiom-balance.mjs > idiom-balance.json
      - name: Download official LayaAir 3.4 runtime
        run: |
          curl -fL --retry 3 https://github.com/layabox/LayaAir/releases/download/v3.4.0/LayaAir_3.4.0_libs.zip -o /tmp/laya-libs.zip
          unzip -q /tmp/laya-libs.zip -d /tmp/laya-libs
          mkdir -p libs
          for engine_file in laya.core.js laya.webgl_2D.js; do
            engine_path="$(find /tmp/laya-libs -name "$engine_file" -print -quit)"
            test -n "$engine_path"
            cp "$engine_path" "libs/$engine_file"
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_QUICK: '1'
      - name: Assemble verified static game
        run: |
          mkdir -p site
          cp index.html legacy.html styles.css site/
          cp -R build libs site/
          touch site/.nojekyll
          test -s site/build/idiom/growth.js
          test -s site/build/legacy-main.js
          test -s site/libs/laya.core.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idiom-growth-deployment-qa
          path: |
            qa-evidence/
            idiom-balance.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
